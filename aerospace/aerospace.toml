# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Reload on save. A manual reload is required once to arm it.
auto-reload-config = true

# Under config-version 2 workspaces are no longer inferred from bindings, so the ones apps are
# assigned to must be listed here or they vanish whenever their app is closed.
persistent-workspaces = ["E", "T", "W", "S", "C", "M", "V", "O"]

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # Two rules cover everything: cmd-ctrl-alt-shift is the hyper key Karabiner puts on caps lock
    # and means "go there", alt-shift means "take this window with me". Bare alt stays unbound so
    # zsh keeps its Meta bindings.

    # Go to a workspace, launching the app if it is not running yet. 'open -a' only activates an
    # app that is already up, and on-window-detected lands a fresh window on the right workspace.
    cmd-ctrl-alt-shift-e = ['workspace E', 'exec-and-forget open -a Emacs']
    cmd-ctrl-alt-shift-t = ['workspace T', 'exec-and-forget open -a Ghostty']
    cmd-ctrl-alt-shift-w = ['workspace W', 'exec-and-forget open -a "Google Chrome"']
    cmd-ctrl-alt-shift-s = ['workspace S', 'exec-and-forget open -a Slack']
    cmd-ctrl-alt-shift-c = ['workspace C', 'exec-and-forget open -a Claude']
    cmd-ctrl-alt-shift-m = ['workspace M', 'exec-and-forget open -a Messages']
    cmd-ctrl-alt-shift-v = ['workspace V', 'exec-and-forget open -a zoom.us']
    cmd-ctrl-alt-shift-o = ['workspace O', 'exec-and-forget open -a Obsidian']

    # Send the focused window to a workspace and follow it there.
    alt-shift-e = 'move-node-to-workspace --focus-follows-window E'
    alt-shift-t = 'move-node-to-workspace --focus-follows-window T'
    alt-shift-w = 'move-node-to-workspace --focus-follows-window W'
    alt-shift-s = 'move-node-to-workspace --focus-follows-window S'
    alt-shift-c = 'move-node-to-workspace --focus-follows-window C'
    alt-shift-m = 'move-node-to-workspace --focus-follows-window M'
    alt-shift-v = 'move-node-to-workspace --focus-follows-window V'
    alt-shift-o = 'move-node-to-workspace --focus-follows-window O'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    cmd-ctrl-alt-shift-h = 'focus left'
    cmd-ctrl-alt-shift-j = 'focus down'
    cmd-ctrl-alt-shift-k = 'focus up'
    cmd-ctrl-alt-shift-l = 'focus right'

    # Cycling is done by window id through a script. AeroSpace's own 'focus dfs-next' crashes the
    # whole app when a workspace holds floating windows (assertion in makeFloatingWindowsSeenAsTiling).
    cmd-ctrl-alt-shift-n = 'exec-and-forget /Users/alex/dotfiles/scripts/aerospace-cycle-window next'
    cmd-ctrl-alt-shift-p = 'exec-and-forget /Users/alex/dotfiles/scripts/aerospace-cycle-window prev'
    cmd-ctrl-alt-shift-quote = 'focus-back-and-forth'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-shift-f = 'fullscreen'
    cmd-ctrl-alt-shift-f = 'fullscreen'
    cmd-ctrl-alt-shift-tab = 'workspace-back-and-forth'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    cmd-ctrl-alt-shift-minus = 'resize smart -50'
    cmd-ctrl-alt-shift-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    cmd-ctrl-alt-shift-slash = 'layout tiles horizontal vertical'
    alt-shift-b = 'balance-sizes'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    cmd-ctrl-alt-shift-semicolon = 'mode service'
    cmd-ctrl-alt-shift-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height -50'
    k = 'resize height +50'
    l = 'resize width +50'
    b = 'balance-sizes'
    enter = 'mode main'
    esc = 'mode main'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    ctrl-alt-shift-h = ['join-with left', 'mode main']
    ctrl-alt-shift-j = ['join-with down', 'mode main']
    ctrl-alt-shift-k = ['join-with up', 'mode main']
    ctrl-alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# One app family per workspace. Ghostty must stay floating: its native tabs are reported to
# AeroSpace as separate windows, so tiling it makes the layout jump on every new tab.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout floating', 'move-node-to-workspace T']

[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-id = 'tandem.app'
run = 'move-node-to-workspace V'

# Tray app: no workspace assignment, so its window opens on whichever workspace is already
# focused. Floating keeps it from reshuffling that workspace's tiling. AeroSpace has no sticky
# windows (nikitabobko/AeroSpace#2), so appearing on every workspace is not possible.
[[on-window-detected]]
if.app-id = 'video.fathom.electron'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace O'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace O'
